spring:
  datasource:
    url: jdbc:h2:mem:testdb;MODE=PostgreSQL;NON_KEYWORDS=YEAR;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration-h2

app:
  jwt:
    secret: test-secret-32-bytes-minimum-length
    accessMinutes: 15
    refreshDays: 7
  upload:
    dir: ./build/test-uploads
