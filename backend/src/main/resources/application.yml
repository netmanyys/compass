server:
  port: 8080

spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://db:5432/compass}
    username: ${DB_USER:compass}
    password: ${DB_PASSWORD:compass}
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    baseline-on-migrate: true
    baseline-version: 0

app:
  jwt:
    secret: ${JWT_SECRET:dev-secret-change-me-please}
    accessMinutes: 15
    refreshDays: 7
  upload:
    dir: ${UPLOAD_DIR:/app/uploads}

logging:
  level:
    org.springframework.security: INFO
